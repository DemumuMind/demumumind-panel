[project]
name = "demumumind-panel"
version = "0.1.0"
description = "Enterprise AI Gateway — aggregates any OpenAI/Anthropic/Gemini-compatible providers into one API + admin panel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.34.*",
    "sqlalchemy[asyncio]==2.0.*",
    "aiosqlite==0.20.*",
    "asyncpg==0.30.*",
    "alembic==1.13.*",
    "redis==5.*",
    "httpx==0.27.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "python-multipart==0.0.*",
    "python-dotenv==1.*",
    "prometheus-client==0.21.*",
    "structlog==24.*",
    "opentelemetry-api==1.*",
    "opentelemetry-sdk==1.*",
    "slowapi==0.1.*",
    "cryptography==43.*",
    "regex==2024.*",
    "jsonschema==4.*",
]

[project.optional-dependencies]
plugins = ["wasmtime"]

[dependency-groups]
dev = [
    "ruff==0.8.*",
    "mypy==1.*",
    "pytest==8.*",
    "pytest-asyncio==0.24.*",
    "types-python-dateutil==2.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "TID", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = [
    "redis.asyncio.*",
    "prometheus_client.*",
    "structlog.*",
    "cryptography.*",
    "slowapi.*",
    "opentelemetry.*",
    "alembic.*",
    "wasmtime.*",
    "jsonschema.*",
    "regex.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
